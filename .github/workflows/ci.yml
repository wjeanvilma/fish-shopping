# Content validate, Kotlin/web parity, and Android signed AAB + mapping (Phase 5).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_pin_bumped:
        description: "Confirm RELEASE_PIN versionName patch + versionCode were bumped for this 1.0.x hotfix"
        required: true
        type: boolean
        default: false
      rollout_step:
        description: "Play staged rollout step (canary=10%, expand=50%, full=100%)"
        required: true
        type: choice
        options:
          - canary
          - expand
          - full
        default: canary

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-and-parity:
    name: Content validate + parity
    runs-on: ubuntu-latest
