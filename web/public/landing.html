<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#153449" />
    <meta name="description" content="Catch, cut, and sell fish in a cozy 3D harbor market." />
    <meta name="application-name" content="Fish Shopping" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Fish Shopping</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #153449;
        --sky: #9fd3ea;
        --reward: #e8af4a;
        --action: #008f95;
        --surface: #f4f8fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 70% -10%, #cfeaf5 0%, transparent 55%),
          linear-gradient(165deg, var(--sky) 0%, var(--surface) 55%, #e7eef3 100%);
      }
      .hero {
        min-height: 100vh;
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 1rem;
        max-width: 40rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: var(--ink);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px rgb(21 52 73 / 0.22);
      }
      .mark img { width: 56px; height: 56px; }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 3.4rem);
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .tagline {
        margin: 0;
        font-size: 1.15rem;
        max-width: 28rem;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
      .button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        min-height: 48px;
        padding: 0.7rem 1.25rem;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        background: var(--action);
        color: #fff;
      }
      .button.ghost {
        background: color-mix(in srgb, #fff 75%, transparent);
        color: var(--ink);
      }
      .fine { margin-top: 1.5rem; font-size: 0.9rem; opacity: 0.75; }
      .fine a { color: var(--action); }
    </style>
  </head>
  <body>
    <section class="hero" aria-label="Fish Shopping">
      <div class="mark" aria-hidden="true">
        <img src="favicon.svg" alt="" width="56" height="56" />
      </div>
      <h1>Fish Shopping</h1>
      <p class="tagline">Catch, cut, sell — run your harbor market</p>
      <div class="actions">
        <a class="button" href="https://github.com/wjeanvilma/fish-shopping">View project</a>
        <a class="button ghost" href="privacy.html">Privacy</a>
        <a class="button ghost" href="support.html">Support</a>
      </div>
      <p class="fine">
        Simulation game · Everyone · Optional cloud &amp; analytics stay off until you opt in.
        Store listing copy lives in <code>shared/store/listing.json</code>.
      </p>
    </section>
  </body>
</html>
