<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#153449" />
    <title>Fish Shopping — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 50% 0%, #9fd3ea 0%, #153449 70%);
        color: #f4fbff;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; opacity: 0.9; max-width: 28rem; }
      a {
        display: inline-block;
        padding: 0.7rem 1.1rem;
        border-radius: 0.5rem;
        background: #f4fbff;
        color: #153449;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Fish Shopping cached the app shell. Reconnect to resume the harbor, or retry when a network is available.</p>
      <a href="./">Retry</a>
    </main>
  </body>
</html>
